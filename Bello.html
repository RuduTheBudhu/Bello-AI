<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bello - AI Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #131314;
            color: #e3e3e3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            background-color: #1e1f20;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        /* Chat Header */
        .chat-header {
            padding: 20px;
            background-color: #1e1f20;
            border-bottom: 1px solid #333537;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 1.5rem;
            color: #fff;
        }

        .chat-header p {
            font-size: 0.85rem;
            color: #9aa0a6;
            margin-top: 4px;
        }

        /* Message Window */
        .chat-messages {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background-color: #374151;
            color: #fff;
            padding: 12px 16px;
            border-radius: 18px 18px 2px 18px;
        }

        .message.ai {
            align-self: flex-start;
            background-color: #282a2d;
            color: #e3e3e3;
            padding: 12px 16px;
            border-radius: 18px 18px 18px 2px;
            border: 1px solid #3c4043;
            white-space: pre-wrap;
        }

        .message-sender {
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 4px;
            color: #9aa0a6;
        }

        .user .message-sender {
            color: #a5b4fc;
            text-align: right;
        }

        /* Input Area */
        .chat-input-area {
            padding: 20px;
            background-color: #1e1f20;
            border-top: 1px solid #333537;
        }

        .input-wrapper {
            display: flex;
            background-color: #2b2c2e;
            border-radius: 28px;
            padding: 6px 12px;
            align-items: center;
            border: 1px solid transparent;
            transition: border 0.2s;
        }

        .input-wrapper:focus-within {
            border: 1px solid #a5b4fc;
        }

        .chat-input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #fff;
            padding: 10px;
            font-size: 1rem;
        }

        .chat-input::placeholder {
            color: #9aa0a6;
        }

        .send-btn {
            background-color: #a5b4fc;
            color: #1e1f20;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .send-btn:hover {
            background-color: #818cf8;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h1>Bello</h1>
            <p>Ask me absolutely anything EXCEPT images and videos</p>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div class="message ai">
                <div class="message-sender">Bello</div>
                <div class="message-text">Hello! I am Bello. Your Personal AI Friend. </div>
            </div>
        </div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <input type="text" id="chat-input" class="chat-input" placeholder="Type your question here..." autocomplete="off">
                <button id="send-btn" class="send-btn">Ask</button>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(sender, text, type) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', type);

            const senderDiv = document.createElement('div');
            senderDiv.classList.add('message-sender');
            senderDiv.innerText = sender;

            const textDiv = document.createElement('div');
            textDiv.classList.add('message-text');
            textDiv.innerText = text;

            messageDiv.appendChild(senderDiv);
            messageDiv.appendChild(textDiv);
            chatMessages.appendChild(messageDiv);

            chatMessages.scrollTop = chatMessages.scrollHeight;
            return messageDiv;
        }

        async function handleSendMessage() {
            const query = chatInput.value.trim();
            if (!query) return;

            // 1. Display User Message
            appendMessage('You', query, 'user');
            chatInput.value = '';

            // 2. Show Bello's Thinking Indicator
            const loadingMessage = appendMessage('Bello', 'Processing Your Text (This might take 15 to 30 seconds) ...', 'ai');

            try {
                // Utilizing an open, unrestricted client-side model system setup
                const apiUrl = `https://openrouter.ai`;
                
                // Using an unauthenticated backup route specifically optimized for open HTML web experiments
                const response = await fetch("https://text.pollinations.ai/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        messages: [
                            { role: "system", content: "You are a friendly and helpful AI assistant named Bello." },
                            { role: "user", content: query }
                        ]
                    })
                });
                
                if (!response.ok) {
                    throw new Error("API response error");
                }

                const reply = await response.text();
                loadingMessage.querySelector('.message-text').innerText = reply.trim();

            } catch (error) {
                // Alternative fallback endpoint just in case one structure has a momentary blackout
                try {
                    const fallbackResponse = await fetch(`https://pollinations.ai{encodeURIComponent(query)}?model=openai`);
                    if (fallbackResponse.ok) {
                        const fallbackReply = await fallbackResponse.text();
                        loadingMessage.querySelector('.message-text').innerText = fallbackReply.trim();
                        return;
                    }
                } catch(e) {}
                
                loadingMessage.querySelector('.message-text').innerText = "Sorry, I am still having trouble linking to my server. Try refreshing your webpage!";
                console.error("Connection failed:", error);
            }
        }

        sendBtn.addEventListener('click', handleSendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSendMessage();
            }
        });
    </script>
</body>
</html>
